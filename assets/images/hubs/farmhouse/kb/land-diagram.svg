<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The land at the Farmhouse, as understood (diagram, not to scale)</title>
  <rect width="820" height="600" fill="#fbfaf6"/>

  <!-- Upper field: the big field above the house -->
  <polygon points="35,331 192,326 280,275 335,274 520,212 545,222 570,470 540,468 100,520"
           fill="#e8dfb8" stroke="#c0392b" stroke-width="2.5"/>
  <!-- NE paddock: below the house, between the two streams -->
  <polygon points="550,30 655,92 662,260 638,368 657,494 620,498 560,470 545,222 530,212 522,175"
           fill="#cfe3c4" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Streams -->
  <path d="M20,330 L192,326 L280,275 L335,274 L520,212 L530,205" fill="none" stroke="#3b7dd8" stroke-width="4"/>
  <path d="M530,205 Q590,150 640,90" fill="none" stroke="#3b7dd8" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M655,40 L662,260 L638,368 L660,496" fill="none" stroke="#3b7dd8" stroke-width="4"/>
  <text x="140" y="315" fill="#2a5ea8" transform="rotate(-8 140 315)">Ruisseau de Gendagne (stream)</text>
  <text x="675" y="300" fill="#2a5ea8" transform="rotate(88 675 300)">Le Besage (stream)</text>

  <!-- Roads -->
  <path d="M40,540 L540,470 L630,500 L800,470" fill="none" stroke="#777" stroke-width="7"/>
  <text x="200" y="545" fill="#555" transform="rotate(-8 200 545)">Route des Châteaux (road)</text>
  <path d="M470,10 L515,60 L528,180 L545,260 L570,470" fill="none" stroke="#777" stroke-width="5"/>
  <text x="582" y="330" fill="#555" font-size="11" transform="rotate(84 582 330)">Chemin de Boismartin</text>

  <!-- House -->
  <rect x="548" y="215" width="40" height="70" fill="#8a5a3c" transform="rotate(-15 568 250)"/>
  <text x="595" y="252" font-weight="bold">House</text>

  <!-- Slope -->
  <line x1="370" y1="455" x2="370" y2="385" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="430" fill="#333" font-size="12">slopes down</text><text x="378" y="445" fill="#333" font-size="12">to the stream</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Lucy 2025: walnut row along the road -->
  <path d="M110,500 L530,452" fill="none" stroke="#5b4636" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="120" y="490" fill="#5b4636" font-size="11" transform="rotate(-7 120 490)">Lucy 2025: walnut row along the road</text>

  <!-- Proposed first groups: near the house (guess) -->
  <ellipse cx="455" cy="330" rx="62" ry="42" fill="none" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="380" y="282" fill="#1e8449" font-weight="bold">First groups? (guess)</text>
  <text x="386" y="378" fill="#1e8449" font-size="11">near house and water</text>

  <!-- Labels -->
  <text x="70" y="410" font-size="18" font-weight="bold" fill="#5a4a10">Upper field (above the house)</text>
  <text x="70" y="430" fill="#5a4a10">about 4 ha, roughly 280 × 160 m</text>
  <text x="70" y="447" fill="#5a4a10">not very wet in winter, dry in summer</text>
  <text x="565" y="70" font-size="15" font-weight="bold" fill="#2e6b1e">Below the house</text>
  <text x="565" y="105" fill="#2e6b1e" font-size="12">damp in winter</text>

  <!-- North -->
  <line x1="770" y1="90" x2="770" y2="30" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="764" y="110" font-weight="bold">N</text>

  <text x="20" y="590" fill="#888" font-size="11">Diagram from the 2024 map outline. Not to scale. Red line: our land. The green circle is a guess, not a decision.</text>
</svg>
